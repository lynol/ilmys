<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanaThèse — Connexion</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont,
                         'Segoe UI', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f1f5f9;
        }

        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo .logo-circle {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #00d2b2, #00213f);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
        }

        .login-logo h1 {
            font-size: 20px;
            font-weight: 700;
            color: #f1f5f9;
        }

        .login-logo p {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.15s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00d2b2;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #00d2b2;
            color: #00213f;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.15s;
        }

        .btn-login:hover { opacity: 0.9; }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            background: #7f1d1d;
            color: #fca5a5;
            border: 1px solid #991b1b;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #334155;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <div class="logo-circle">S</div>
            <h1>SanaThèse</h1>
            <p>Espace doctoral privé · Alidou Sana</p>
        </div>

        {% if error %}
        <div class="alert">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email"
                       placeholder="ton.email@gmail.com"
                       required autofocus>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" name="password"
                       placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">
                Accéder à SanaThèse →
            </button>
        </form>

        <div class="footer-note">
            Accès strictement privé · ilmys.com
        </div>
    </div>
</body>
</html>
